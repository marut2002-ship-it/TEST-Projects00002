
<!DOCTYPE html>
<html lang="th">
<head>

    <title>ระบบลงทะเบียนอบรมขอรับใบอนุญาตประกัน</title>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      // --- GLOBAL IMPORTS & UTILS ---
      const { useState, useEffect, useRef } = React;

      // --- LUCIDE ICON ADAPTER (SAFE) ---
      const lucideMap = {};
      const lucideRaw = window.lucide;

      if (lucideRaw && lucideRaw.icons) {
        // Helper to render icon nodes recursively
        const renderIconNode = ([tag, attrs, children]) => {
            return React.createElement(
                tag,
                { ...attrs, key: Math.random() },
                (children || []).map(renderIconNode)
            );
        };

        const createIconComponent = (name, iconNode) => {
            return ({ color = "currentColor", size = 24, strokeWidth = 2, className, ...props }) => {
                return React.createElement(
                    "svg",
                    {
                        ...props,
                        xmlns: "http://www.w3.org/2000/svg",
                        width: size,
                        height: size,
                        viewBox: "0 0 24 24",
                        fill: "none",
                        stroke: color,
                        strokeWidth: strokeWidth,
                        strokeLinecap: "round",
                        strokeLinejoin: "round",
                        className: `lucide lucide-${name} ${className || ''}`
                    },
                    iconNode.map(renderIconNode)
                );
            };
        };

        Object.keys(lucideRaw.icons).forEach(key => {
            const Comp = createIconComponent(key, lucideRaw.icons[key]);
            lucideMap[key] = Comp;
            lucideMap[`Lucide${key}`] = Comp; 
        });
      }

      // Proxy to handle undefined icons gracefully (Prevents React Error #130)
      const lucide = new Proxy(lucideMap, {
          get: (target, prop) => {
              if (prop in target) return target[prop];
              // Fallback Component for missing icons
              return ({ size = 24, ...props }) => React.createElement(
                  'svg', 
                  { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "#cbd5e1", strokeWidth: 2, ...props },
                  React.createElement('rect', { x: 2, y: 2, width: 20, height: 20, rx: 2 }),
                  React.createElement('line', { x1: 2, y1: 2, x2: 22, y2: 22 }),
                  React.createElement('line', { x1: 22, y1: 2, x2: 2, y2: 22 })
              );
          }
      });

      const { 
        LucideShieldCheck, LucideUser, LucideLayoutDashboard, LucideLogOut, 
        LucideUserPlus, LucideSearch, LucideShield, LucideArrowRight, LucideLock,
        LucideUpload, LucideCheckCircle, LucideAlertCircle, LucideChevronRight, 
        LucideChevronLeft, LucideFileText, LucideBriefcase, LucideDollarSign, 
        LucideCheck, LucideEye, LucideX, LucideCalendar, LucideMapPin, 
        LucideUsers, LucideClipboardCheck, LucideLoader, LucideBuilding, 
        LucideQrCode, LucideMaximize2, LucideBanknote, LucideClock, LucideTrendingUp,
        LucideFilter, LucideCamera, LucideSave, LucidePrinter, LucideCopy, 
        LucideFileSpreadsheet, LucideImages, LucideCheckSquare, LucideArchive,
        LucideXCircle, LucideLayoutGrid, LucideEdit, LucideActivity
      } = lucide;

      // --- RECHARTS ADAPTER (SAFE) ---
      const RechartsLib = window.Recharts || {};
      
      // Fallback generator for missing Recharts components
      const safeRecharts = (name) => RechartsLib[name] || (({children}) => children || null);
      
      const BarChart = safeRecharts('BarChart');
      const Bar = safeRecharts('Bar');
      const XAxis = safeRecharts('XAxis');
      const YAxis = safeRecharts('YAxis');
      const CartesianGrid = safeRecharts('CartesianGrid');
      const RechartsTooltip = safeRecharts('Tooltip');
      const ResponsiveContainer = RechartsLib.ResponsiveContainer || (({children}) => <div style={{width:'100%', height:'100%'}}>{children}</div>);
      const PieChart = safeRecharts('PieChart');
      const Pie = safeRecharts('Pie');
      const Cell = safeRecharts('Cell');

      // --- CONFIGURATION ---
      const API_URL = "https://script.google.com/macros/s/AKfycbxQ0b5oPHnR_J5_fPOcUtGihmq-pjdQ3Fhy_KZwTLPvHi4LUwGWQn8aIU4yydJFWdeGnw/exec";

      // --- TYPES ---
      const LicenseType = {
        LIFE: 'Life Insurance (นช)',
        NON_LIFE: 'Non-Life Insurance (นว)'
      };
      const ExamMode = {
        SELF: 'Self-Passed (สอบเอง)',
        COMPANY: 'Company-Passed (สอบกับบริษัท)'
      };
      const RegistrationStatus = {
        PENDING: 'PENDING',
        APPROVED: 'APPROVED',
        REJECTED: 'REJECTED'
      };
      const BatchStatus = {
        NOT_JOINED_LINE: 'ยังไม่เข้าห้องไลน์',
        JOINED_LINE: 'เข้าห้องไลน์',
        MORNING_SESSION: 'รอบเช้า',
        AFTERNOON_SESSION: 'รอบบ่าย',
        COMPLETED: 'สมบูรณ์',
        WAIVED: 'สละสิทธิ์'
      };
      const ReimbursementStatus = {
        PENDING: 'รอเบิกจ่าย',
        PROCESSED: 'เบิกจ่ายแล้ว'
      };

      // --- API ADAPTER (Fetch) ---
      const api = {
        _get: async (action, params = '') => {
          const url = `${API_URL}?action=${action}${params}`;
          const response = await fetch(url);
          const json = await response.json();
          if(!json.success) throw new Error(json.error || 'API Error');
          return json.data;
        },
        _post: async (action, data) => {
          // IMPORTANT: Send as text/plain to avoid CORS OPTIONS preflight issues with Google Apps Script
          const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action, ...data }),
          });
          const json = await response.json();
          if(!json.success) throw new Error(json.error || 'API Error');
          return json.data;
        },
        
        getSessions: async (type) => api._get('getSessions', `&type=${encodeURIComponent(type)}`),
        getAllSessions: async () => api._get('getAllSessions'),
        searchRegistration: async (query) => api._get('searchRegistration', `&query=${encodeURIComponent(query)}`),
        getAllRegistrations: async () => api._get('getAllRegistrations'),
        getStats: async () => api._get('getStats'),
        
        submitRegistration: async (data) => {
           const processedFiles = {};
           if(data.photoFile) processedFiles.photo = await fileToBase64(data.photoFile);
           if(data.idCardFile) processedFiles.idCard = await fileToBase64(data.idCardFile);
           if(data.examResultFile) processedFiles.examResult = await fileToBase64(data.examResultFile);
           if(data.receiptFile) processedFiles.receipt = await fileToBase64(data.receiptFile);
           if(data.bankBookFile) processedFiles.bankBook = await fileToBase64(data.bankBookFile);
           if(data.idCopyReimburseFile) processedFiles.idCopyReimburse = await fileToBase64(data.idCopyReimburseFile);

           const payload = { ...data, files: processedFiles };
           delete payload.photoFile; delete payload.idCardFile; delete payload.examResultFile;
           delete payload.receiptFile; delete payload.bankBookFile; delete payload.idCopyReimburseFile;
           
           return api._post('submitRegistration', payload);
        },
        updateStatus: (id, status) => api._post('updateStatus', { id, status }),
        updateBatchStatus: (id, status) => api._post('updateBatchStatus', { id, status }),
        updateReimbursementStatus: (id, status) => api._post('updateReimbursementStatus', { id, status }),
        updateRegistrationDetails: (id, data) => api._post('updateRegistrationDetails', { id, data }),
      };

      // --- HELPER FUNCTIONS ---
      const fileToBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => {
             const result = reader.result;
             const base64 = result.split(',')[1];
             resolve({ name: file.name, mimeType: file.type, data: base64 });
          };
          reader.onerror = error => reject(error);
        });
      };

      // --- COMPONENTS ---

      const InputField = ({ label, required, ...props }) => (
        <div className="group">
            <label className="block text-sm font-semibold text-slate-700 mb-2 transition-colors group-focus-within:text-brand-600">
                {label} {required && <span className="text-red-500">*</span>}
            </label>
            <input 
                {...props}
                required={required}
                className="w-full px-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all outline-none text-slate-700 placeholder-slate-400 font-medium hover:border-slate-300"
            />
        </div>
      );

      const FileInput = ({ label, subLabel, required, onChange, variant = 'blue', exampleUrl, onPreview }) => {
        const isGreen = variant === 'green';
        const borderColor = isGreen ? 'hover:border-emerald-400' : 'hover:border-brand-400';
        const iconColor = isGreen ? 'text-emerald-500' : 'text-brand-500';
        const bgHover = isGreen ? 'group-hover:bg-emerald-50' : 'group-hover:bg-brand-50';

        return (
            <div className={`group relative border-2 border-dashed border-slate-300 rounded-2xl p-6 transition-all cursor-pointer text-center bg-white ${borderColor} hover:shadow-sm`}>
                {exampleUrl && (
                    <button
                        type="button"
                        onClick={(e) => { e.preventDefault(); e.stopPropagation(); onPreview(exampleUrl); }}
                        className="absolute top-3 right-3 z-20 flex items-center gap-1.5 px-3 py-1.5 bg-white/90 backdrop-blur-sm text-[11px] font-bold text-brand-600 rounded-full shadow-sm border border-brand-100 hover:bg-brand-50 transition-all hover:scale-105"
                    >
                        <LucideEye className="w-3.5 h-3.5" /> ตัวอย่าง
                    </button>
                )}
                <div className={`w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 bg-slate-50 ${bgHover} transition-colors`}>
                    <LucideUpload className={`w-6 h-6 text-slate-400 group-hover:${iconColor} transition-colors`} />
                </div>
                <label className="block text-sm font-bold text-slate-700 mb-1 pointer-events-none group-hover:text-slate-900">
                {label} {required && <span className="text-red-500">*</span>}
                </label>
                {subLabel && <p className="text-xs text-slate-400 mb-2">{subLabel}</p>}
                <div className="mt-2">
                    <span className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide bg-slate-100 text-slate-500 ${bgHover} group-hover:${iconColor} transition-colors`}>Browse File</span>
                </div>
                <input type="file" onChange={onChange} required={required} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            </div>
        );
      };

      const ReviewItem = ({ label, value }) => (
        <div className="flex flex-col">
            <span className="text-xs text-slate-400 font-medium mb-0.5">{label}</span>
            <span className="text-slate-800 font-semibold">{value || '-'}</span>
        </div>
      );

      const FileBadge = ({ label, file, color = 'blue' }) => {
        const bgColor = color === 'green' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-blue-100 text-blue-700 border-blue-200';
        return (
            <div className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-bold ${file ? bgColor : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
                {file ? <LucideCheckCircle className="w-3 h-3" /> : <LucideX className="w-3 h-3" />}
                {label}
            </div>
        );
      };

      const Layout = ({ children, activeView, onChangeView, isAdminLoggedIn, onLogout }) => {
        return (
          <div className="min-h-screen relative flex flex-col overflow-hidden">
            <div className="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 bg-slate-50/50">
              <div className="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-brand-200/20 rounded-full blur-[100px]" />
              <div className="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-indigo-200/20 rounded-full blur-[120px]" />
            </div>

            <nav className="glass-nav sticky top-0 z-50 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between items-center h-20">
                  <div className="flex items-center gap-3 cursor-pointer group" onClick={() => onChangeView('public')}>
                    <div className="bg-gradient-to-br from-brand-600 to-brand-800 p-2.5 rounded-xl text-white shadow-lg shadow-brand-500/30 group-hover:scale-105 transition-transform duration-300">
                       <LucideShieldCheck className="h-7 w-7" />
                    </div>
                    <div className="flex flex-col">
                      <h1 className="text-xl font-bold tracking-tight text-slate-800 leading-tight">ระบบลงทะเบียนอบรม</h1>
                      <p className="text-[11px] text-slate-500 font-medium tracking-wide uppercase text-brand-600">Insurance License Training</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => onChangeView('public')}
                      className={`relative px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 flex items-center gap-2 overflow-hidden ${
                        activeView === 'public' ? 'bg-brand-50 text-brand-700 ring-1 ring-brand-200 shadow-sm' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-700'
                      }`}
                    >
                      <LucideUser className="w-4 h-4" /> <span className="hidden md:inline">สำหรับผู้ใช้ทั่วไป</span>
                    </button>

                    {isAdminLoggedIn ? (
                       <div className="flex items-center gap-2 pl-3 ml-1 border-l border-slate-200">
                          <button
                            onClick={() => onChangeView('admin')}
                            className={`relative px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 flex items-center gap-2 ${
                              activeView === 'admin' ? 'bg-slate-800 text-white shadow-lg shadow-slate-500/20' : 'text-slate-600 hover:bg-slate-100'
                            }`}
                          >
                            <LucideLayoutDashboard className="w-4 h-4" /> <span className="hidden md:inline">ผู้ดูแลระบบ</span>
                          </button>
                          <button onClick={onLogout} className="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors" title="ออกจากระบบ">
                            <LucideLogOut className="w-5 h-5" />
                          </button>
                       </div>
                    ) : (
                      <button onClick={() => onChangeView('admin')} className="px-4 py-2 rounded-full text-sm font-medium text-slate-400 hover:text-brand-600 hover:bg-white transition-all">
                        เจ้าหน้าที่
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </nav>

            <main className="flex-grow w-full max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 relative z-0">
              {children}
            </main>

            <footer className="bg-white/50 backdrop-blur border-t border-slate-200 text-slate-500 py-8 mt-auto">
              <div className="container mx-auto px-4 text-center">
                <p className="text-sm font-semibold text-slate-600">© {new Date().getFullYear()} Insurance Training Center</p>
              </div>
            </footer>
          </div>
        );
      };

      const RegistrationForm = () => {
        const [currentStep, setCurrentStep] = useState(1);
        const [loading, setLoading] = useState(false);
        const [success, setSuccess] = useState(false);
        const [error, setError] = useState(null);
        const [previewImage, setPreviewImage] = useState(null);
        const [sessions, setSessions] = useState([]);
        const [loadingSessions, setLoadingSessions] = useState(false);

        const [formData, setFormData] = useState({
          licenseType: LicenseType.LIFE,
          examMode: ExamMode.SELF,
          wantReimbursement: false,
          prefix: 'นาย',
          position: '', zone: '', region: '', branch: '', idCard: '', empId: '',
          firstName: '', lastName: '', dob: '', phone: '', email: '', trainingSessionId: ''
        });

        const [files, setFiles] = useState({ photo: null, idCard: null, examResult: null, receipt: null, bankBook: null, idCopyReimburse: null });

        useEffect(() => {
          const fetchSessions = async () => {
              if (!formData.licenseType) return;
              setLoadingSessions(true);
              try {
                  const data = await api.getSessions(formData.licenseType);
                  setSessions(data);
              } catch (e) { console.error(e); } finally { setLoadingSessions(false); }
          };
          fetchSessions();
        }, [formData.licenseType]);

        const handleChange = (e) => {
          const { name, value, type, checked } = e.target;
          setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
        };

        const handleSessionSelect = (session) => {
            setFormData(prev => ({
                ...prev, trainingSessionId: session.id, trainingDate: session.date, trainingBatch: session.batchName
            }));
        };

        const handleFileChange = (e, fieldName) => {
          if (e.target.files && e.target.files[0]) {
            setFiles(prev => ({ ...prev, [fieldName]: e.target.files[0] }));
          }
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setLoading(true); setError(null);
          if (!formData.idCard || !formData.empId || !formData.firstName || !formData.trainingSessionId) {
              setError("กรุณากรอกข้อมูลสำคัญและเลือกรุ่นการอบรมให้ครบถ้วน");
              setLoading(false); return;
          }
          try {
            await api.submitRegistration({
              ...formData,
              photoFile: files.photo,
              idCardFile: files.idCard,
              examResultFile: files.examResult,
              receiptFile: files.receipt,
              bankBookFile: files.bankBook,
              idCopyReimburseFile: files.idCopyReimburse,
            });
            setSuccess(true);
            window.scrollTo(0, 0);
          } catch (err) {
            setError(err.message || "เกิดข้อผิดพลาดในการส่งข้อมูล: " + err.message);
          } finally { setLoading(false); }
        };

        const nextStep = () => setCurrentStep(prev => Math.min(prev + 1, 6));
        const prevStep = () => setCurrentStep(prev => Math.max(prev - 1, 1));
        
        const STEPS = [
          { id: 1, title: 'หลักสูตร', icon: LucideFileText },
          { id: 2, title: 'เลือกรุ่น', icon: LucideCalendar },
          { id: 3, title: 'ข้อมูลส่วนตัว', icon: LucideUser },
          { id: 4, title: 'ข้อมูลงาน', icon: LucideBriefcase },
          { id: 5, title: 'เอกสาร', icon: LucideUpload },
          { id: 6, title: 'ตรวจสอบ', icon: LucideClipboardCheck },
        ];

        if (success) {
            return (
              <div className="max-w-xl mx-auto text-center py-20 bg-white rounded-3xl shadow-soft p-10 animate-slideUp border border-slate-100">
                <div className="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                    <LucideCheckCircle className="w-12 h-12 text-green-500" />
                </div>
                <h2 className="text-3xl font-bold text-slate-800 mb-3">ลงทะเบียนสำเร็จ!</h2>
                <p className="text-slate-500 mb-8">ข้อมูลถูกส่งเข้าระบบเรียบร้อยแล้ว รอการอนุมัติ 1-2 วันทำการ</p>
                <button onClick={() => window.location.reload()} className="bg-brand-600 text-white px-8 py-3.5 rounded-xl font-bold">ลงทะเบียนท่านอื่นต่อ</button>
              </div>
            );
        }

        return (
            <div className="max-w-6xl mx-auto">
                 {previewImage && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn" onClick={() => setPreviewImage(null)}>
                        <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden animate-slideUp" onClick={e => e.stopPropagation()}>
                            <div className="p-4 border-b flex justify-between items-center"><h3 className="font-bold">ตัวอย่าง</h3><button onClick={() => setPreviewImage(null)}><LucideX/></button></div>
                            <div className="p-6 flex justify-center"><img src={previewImage} className="max-h-[60vh] object-contain rounded"/></div>
                        </div>
                    </div>
                )}
                 
                 <div className="flex justify-between items-start relative z-0 max-w-5xl mx-auto px-4 overflow-x-auto pb-4 hide-scrollbar mb-10">
                    <div className="absolute top-[22px] left-0 w-full h-[2px] bg-slate-100 -z-10 rounded-full mx-4 min-w-[600px]">
                         <div className="h-full bg-brand-500 transition-all duration-700 ease-in-out rounded-full" style={{ width: `${((currentStep - 1) / (STEPS.length - 1)) * 100}%` }}></div>
                    </div>
                    <div className="flex justify-between w-full min-w-[600px]">
                        {STEPS.map((step) => {
                            const Icon = step.icon;
                            const isActive = currentStep >= step.id;
                            const isCurrent = currentStep === step.id;
                            return (
                                <div key={step.id} className="flex flex-col items-center group cursor-default">
                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center transition-all border-[3px] shadow-sm z-10 ${isActive ? 'bg-brand-600 border-white text-white scale-110' : 'bg-white border-slate-100 text-slate-300'}`}>
                                        <Icon className="w-5 h-5" />
                                    </div>
                                    <p className={`text-sm font-bold mt-3 ${isActive ? 'text-slate-800' : 'text-slate-400'}`}>{step.title}</p>
                                </div>
                            );
                        })}
                    </div>
                </div>

                <div className="bg-white rounded-[2rem] shadow-soft overflow-hidden border border-slate-100 relative">
                  <form onSubmit={handleSubmit}>
                    <div className="p-8 lg:p-12 min-h-[450px]">
                        {error && <div className="mb-8 bg-red-50 border border-red-100 p-4 rounded-2xl text-red-700 flex gap-2"><LucideAlertCircle /> {error}</div>}
                        
                        <div className="max-w-4xl mx-auto animate-slideUp">
                            {currentStep === 1 && (
                                <div className="space-y-8">
                                    <h3 className="text-xl font-bold">เลือกประเภทการอบรม</h3>
                                    <div className="grid md:grid-cols-2 gap-8">
                                        {[ {v: LicenseType.LIFE, l: 'ประกันชีวิต'}, {v: LicenseType.NON_LIFE, l: 'วินาศภัย'} ].map(opt => (
                                            <label key={opt.v} className={`p-6 border-2 rounded-xl cursor-pointer ${formData.licenseType === opt.v ? 'border-brand-500 bg-brand-50' : 'border-slate-100'}`}>
                                                <input type="radio" name="licenseType" value={opt.v} checked={formData.licenseType === opt.v} onChange={handleChange} className="sr-only"/>
                                                <span className="font-bold block text-lg">{opt.l}</span>
                                            </label>
                                        ))}
                                    </div>
                                    <h3 className="text-xl font-bold pt-4">รูปแบบการสอบ</h3>
                                    <div className="grid md:grid-cols-2 gap-8">
                                         {[ {v: ExamMode.SELF, l: 'สอบเอง (Self)'}, {v: ExamMode.COMPANY, l: 'สอบกับบริษัท'} ].map(opt => (
                                            <label key={opt.v} className={`p-6 border-2 rounded-xl cursor-pointer ${formData.examMode === opt.v ? 'border-brand-500 bg-brand-50' : 'border-slate-100'}`}>
                                                <input type="radio" name="examMode" value={opt.v} checked={formData.examMode === opt.v} onChange={handleChange} className="sr-only"/>
                                                <span className="font-bold block text-lg">{opt.l}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {currentStep === 2 && (
                                <div className="space-y-6">
                                    <h3 className="text-xl font-bold">เลือกรุ่นอบรม</h3>
                                    {loadingSessions ? <div className="text-center p-10"><LucideLoader className="animate-spin mx-auto"/> Loading...</div> : 
                                     sessions.length === 0 ? <p className="text-center p-10 text-slate-400">ไม่พบรุ่นอบรม</p> :
                                     <div className="grid md:grid-cols-2 gap-4">
                                        {sessions.map(s => {
                                            const isFull = s.currentSeats >= s.maxSeats;
                                            const selected = formData.trainingSessionId === s.id;
                                            return (
                                                <div key={s.id} onClick={() => !isFull && handleSessionSelect(s)} className={`p-6 rounded-2xl border-2 cursor-pointer ${isFull ? 'opacity-60 bg-slate-50' : selected ? 'border-brand-500 bg-brand-50' : 'border-slate-100 hover:border-brand-200'}`}>
                                                    <div className="flex justify-between">
                                                        <h4 className="font-bold">{s.batchName}</h4>
                                                        {selected && <LucideCheck className="text-brand-600"/>}
                                                    </div>
                                                    <p className="text-sm text-slate-500">{new Date(s.date).toLocaleDateString('th-TH')}</p>
                                                    <div className="mt-2 text-xs font-bold text-brand-600">{isFull ? 'เต็ม' : `ว่าง ${s.maxSeats - s.currentSeats} ที่นั่ง`}</div>
                                                </div>
                                            )
                                        })}
                                     </div>
                                    }
                                </div>
                            )}

                            {currentStep === 3 && (
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="md:col-span-2"><InputField label="เลขบัตรประชาชน" name="idCard" value={formData.idCard} onChange={handleChange} maxLength={13} required/></div>
                                    <div><InputField label="รหัสพนักงาน" name="empId" value={formData.empId} onChange={handleChange} required/></div>
                                    <div>
                                        <label className="font-bold text-sm text-slate-700">คำนำหน้า</label>
                                        <select className="w-full p-3.5 bg-slate-50 border rounded-xl mt-2" name="prefix" value={formData.prefix} onChange={handleChange}><option>นาย</option><option>นาง</option><option>นางสาว</option></select>
                                    </div>
                                    <div><InputField label="ชื่อจริง" name="firstName" value={formData.firstName} onChange={handleChange} required/></div>
                                    <div><InputField label="นามสกุล" name="lastName" value={formData.lastName} onChange={handleChange} required/></div>
                                    <div><InputField label="วันเกิด" type="date" name="dob" value={formData.dob} onChange={handleChange}/></div>
                                    <div><InputField label="เบอร์โทรศัพท์" name="phone" value={formData.phone} onChange={handleChange} required/></div>
                                    <div className="md:col-span-2"><InputField label="อีเมล" type="email" name="email" value={formData.email} onChange={handleChange}/></div>
                                </div>
                            )}

                            {currentStep === 4 && (
                                <div className="grid md:grid-cols-2 gap-6">
                                    <InputField label="ตำแหน่ง" name="position" value={formData.position} onChange={handleChange}/>
                                    <InputField label="สาขา / แผนก" name="branch" value={formData.branch} onChange={handleChange}/>
                                    <InputField label="เขต / ฝ่าย" name="zone" value={formData.zone} onChange={handleChange}/>
                                    <InputField label="สังกัดภาค" name="region" value={formData.region} onChange={handleChange}/>
                                </div>
                            )}

                            {currentStep === 5 && (
                                <div className="space-y-6">
                                    <h3 className="font-bold">อัปโหลดเอกสาร</h3>
                                    <div className="grid md:grid-cols-3 gap-4">
                                        <FileInput label="รูปถ่ายหน้าตรง" onChange={(e)=>handleFileChange(e,'photo')} required exampleUrl="https://via.placeholder.com/150" onPreview={setPreviewImage}/>
                                        <FileInput label="สำเนาบัตรประชาชน" onChange={(e)=>handleFileChange(e,'idCard')} required/>
                                        <FileInput label="ผลสอบผ่าน (OIC)" onChange={(e)=>handleFileChange(e,'examResult')} required/>
                                    </div>
                                    {formData.examMode === ExamMode.SELF && (
                                        <div className="bg-emerald-50 p-6 rounded-xl border border-emerald-100">
                                            <label className="flex items-center gap-3 font-bold text-slate-800">
                                                <input type="checkbox" name="wantReimbursement" checked={formData.wantReimbursement} onChange={handleChange} className="w-5 h-5 accent-emerald-600"/>
                                                ขอเบิกเงินค่าสมัครสอบ (200 บาท)
                                            </label>
                                            {formData.wantReimbursement && (
                                                <div className="grid md:grid-cols-3 gap-4 mt-4">
                                                    <FileInput label="ใบเสร็จ" variant="green" onChange={(e)=>handleFileChange(e,'receipt')} required/>
                                                    <FileInput label="สำเนาบัตร (เบิก)" variant="green" onChange={(e)=>handleFileChange(e,'idCopyReimburse')} required/>
                                                    <FileInput label="หน้าสมุดบัญชี" variant="green" onChange={(e)=>handleFileChange(e,'bankBook')} required/>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                             {currentStep === 6 && (
                                <div className="bg-slate-50 p-6 rounded-xl space-y-4 text-sm">
                                    <h3 className="font-bold text-lg border-b pb-2">สรุปข้อมูล</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <ReviewItem label="ชื่อ-นามสกุล" value={`${formData.prefix}${formData.firstName} ${formData.lastName}`} />
                                        <ReviewItem label="รุ่นอบรม" value={formData.trainingBatch} />
                                        <ReviewItem label="รหัสพนักงาน" value={formData.empId} />
                                        <ReviewItem label="เบอร์โทร" value={formData.phone} />
                                    </div>
                                    <div className="flex gap-2 pt-4">
                                        <FileBadge label="รูปถ่าย" file={files.photo} />
                                        <FileBadge label="บัตรประชาชน" file={files.idCard} />
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="bg-slate-50/50 p-6 border-t flex justify-between">
                        {currentStep > 1 && <button type="button" onClick={prevStep} className="px-6 py-3 font-bold text-slate-500">ย้อนกลับ</button>}
                        {currentStep < 6 ? 
                            <button type="button" onClick={nextStep} className="bg-brand-600 text-white px-8 py-3 rounded-xl font-bold ml-auto">ถัดไป</button> :
                            <button type="submit" disabled={loading} className="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold ml-auto">{loading?'Sending...':'ยืนยัน'}</button>
                        }
                    </div>
                  </form>
                </div>
            </div>
        );
      };

      const StatusTracker = () => {
          const [query, setQuery] = useState('');
          const [results, setResults] = useState(null);
          const [loading, setLoading] = useState(false);
          const [showQr, setShowQr] = useState(false);

          const handleSearch = async (e) => {
              e.preventDefault(); if(!query) return;
              setLoading(true);
              try { setResults(await api.searchRegistration(query)); } catch(e){console.error(e);}
              setLoading(false);
          };

          return (
              <div className="max-w-4xl mx-auto space-y-8">
                  {/* QR Modal */}
                  {showQr && <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={()=>setShowQr(false)}>
                      <div className="bg-white p-6 rounded-2xl max-w-sm w-full relative">
                          <button className="absolute top-2 right-2" onClick={()=>setShowQr(false)}><LucideX/></button>
                          <h3 className="text-center font-bold text-xl mb-4">QR CODE เข้าห้องไลน์</h3>
                          <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=LINE_GROUP_LINK" className="w-full"/>
                      </div>
                  </div>}

                  <div className="bg-slate-900 text-white rounded-3xl p-10 text-center relative overflow-hidden">
                      <div className="relative z-10">
                          <h2 className="text-3xl font-bold mb-2">ตรวจสอบสถานะ</h2>
                          <form onSubmit={handleSearch} className="flex bg-white rounded-full p-2 max-w-md mx-auto shadow-lg mt-6">
                              <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="ระบุรหัสพนักงาน / เลขบัตร" className="flex-grow bg-transparent px-4 outline-none text-slate-800"/>
                              <button type="submit" className="bg-brand-600 rounded-full px-6 py-2 font-bold">{loading?'...':'ค้นหา'}</button>
                          </form>
                      </div>
                  </div>

                  {results && <div className="space-y-4">
                      {results.length===0 ? <div className="text-center p-10 bg-white rounded-2xl">ไม่พบข้อมูล</div> :
                       results.map(r => (
                           <div key={r.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row gap-6 relative overflow-hidden">
                               <div className="absolute left-0 top-0 bottom-0 w-2 bg-brand-500"></div>
                               <div className="flex-grow">
                                   <div className="flex justify-between items-start">
                                       <div>
                                           <h3 className="text-xl font-bold">{r.prefix} {r.firstName} {r.lastName}</h3>
                                           <p className="text-sm text-slate-500">ID: {r.empId} • {r.position}</p>
                                       </div>
                                       <span className={`px-3 py-1 rounded-full text-xs font-bold ${r.status==='APPROVED'?'bg-green-100 text-green-700':r.status==='REJECTED'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}`}>{r.status}</span>
                                   </div>
                                   <div className="grid grid-cols-2 gap-4 mt-4 text-sm">
                                       <div><span className="text-slate-400 block text-xs">รุ่นอบรม</span><b>{r.trainingBatch || '-'}</b></div>
                                       <div><span className="text-slate-400 block text-xs">วันที่อบรม</span><b>{r.trainingDate || '-'}</b></div>
                                       <div><span className="text-slate-400 block text-xs">สถานะเบิกเงิน</span>
                                            {r.wantReimbursement ? <b className={r.reimbursementStatus==='เบิกจ่ายแล้ว'?'text-green-600':'text-amber-600'}>{r.reimbursementStatus}</b> : '-'}
                                       </div>
                                   </div>
                               </div>
                               <div className="bg-slate-50 p-4 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100" onClick={()=>setShowQr(true)}>
                                   <LucideQrCode className="w-10 h-10 mb-1"/>
                                   <span className="text-[10px] font-bold">QR เข้าห้องไลน์</span>
                               </div>
                           </div>
                       ))
                      }
                  </div>}
              </div>
          );
      };

      const AdminDashboard = () => {
          const [stats, setStats] = useState(null);
          const [data, setData] = useState([]);
          const [tab, setTab] = useState('overview'); 
          const [selectedBatch, setSelectedBatch] = useState('all');
          const [loading, setLoading] = useState(true);
          const [showScreenshot, setShowScreenshot] = useState(false);

          const fetchData = async () => {
              setLoading(true);
              try {
                  const [s, d] = await Promise.all([api.getStats(), api.getAllRegistrations()]);
                  setStats(s); setData(d); 
              } catch (e) {
                  console.error(e);
                  setStats({total: 0, pending: 0, approved: 0, rejected: 0, byType: [], sessions: []});
                  setData([]);
              } finally {
                  setLoading(false);
              }
          };
          useEffect(() => { fetchData(); }, []);

          const filteredData = () => {
              let res = [...data];
              if(tab==='life') res = res.filter(r => r.licenseType.includes('Life') && !r.licenseType.includes('Non'));
              if(tab==='non_life') res = res.filter(r => r.licenseType.includes('Non-Life'));
              if(tab==='batch') {
                  if(selectedBatch !== 'all') res = res.filter(r => r.trainingSessionId === selectedBatch);
                  res = res.filter(r => r.trainingSessionId); 
                  res.sort((a,b) => a.idCard.localeCompare(b.idCard));
              }
              if(tab==='reimburse') res = res.filter(r => r.wantReimbursement);
              return res;
          };

          const handleBatchStatus = async (id, status) => {
              await api.updateBatchStatus(id, status); fetchData();
          };
          const handleReimbursementStatus = async (id, status) => {
              await api.updateReimbursementStatus(id, status); fetchData();
          };

          const downloadImages = async () => {
             const zip = new JSZip();
             filteredData().forEach((r, i) => { zip.file(`${i+1}_${r.idCard}_info.txt`, "Image links placeholder for GitHub Demo"); });
             const content = await zip.generateAsync({type:"blob"});
             saveAs(content, "Batch_Images.zip");
          };
          
          if(loading) return <div className="flex justify-center h-96 items-center"><LucideLoader className="animate-spin text-brand-500 w-10 h-10"/></div>;

          return (
              <div className="space-y-6 pb-20">
                  <div className="flex gap-2 overflow-x-auto pb-2 border-b">
                      {['overview','life','non_life','batch','reimburse'].map(t => (
                          <button key={t} onClick={()=>setTab(t)} className={`px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap ${tab===t?'bg-slate-800 text-white':'bg-white border'}`}>
                             {t.toUpperCase()}
                          </button>
                      ))}
                  </div>

                  {tab === 'overview' ? (
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                          <div className="bg-white p-6 rounded-2xl shadow-sm border"><h3 className="text-slate-500 text-sm">ทั้งหมด</h3><p className="text-3xl font-bold">{stats.total}</p></div>
                          <div className="bg-white p-6 rounded-2xl shadow-sm border"><h3 className="text-slate-500 text-sm">รออนุมัติ</h3><p className="text-3xl font-bold text-amber-500">{stats.pending}</p></div>
                          <div className="bg-white p-6 rounded-2xl shadow-sm border"><h3 className="text-slate-500 text-sm">อนุมัติแล้ว</h3><p className="text-3xl font-bold text-green-500">{stats.approved}</p></div>
                          <div className="bg-white p-6 rounded-2xl shadow-sm border"><h3 className="text-slate-500 text-sm">ไม่ผ่าน</h3><p className="text-3xl font-bold text-red-500">{stats.rejected}</p></div>
                          <div className="md:col-span-4 h-64 bg-white p-4 rounded-2xl border shadow-sm">
                              <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={stats.byType}>
                                  <CartesianGrid strokeDasharray="3 3" />
                                  <XAxis dataKey="name" />
                                  <YAxis />
                                  <RechartsTooltip />
                                  <Bar dataKey="value" fill="#3b82f6" />
                                </BarChart>
                              </ResponsiveContainer>
                          </div>
                      </div>
                  ) : (
                      <div className="bg-white rounded-2xl border shadow-sm overflow-hidden">
                          <div className="p-4 border-b flex justify-between items-center flex-wrap gap-2">
                              <h3 className="font-bold">รายการข้อมูล ({filteredData().length})</h3>
                              <div className="flex gap-2">
                                  {tab === 'batch' && (
                                      <>
                                        <select value={selectedBatch} onChange={e=>setSelectedBatch(e.target.value)} className="border rounded-lg px-2 py-1 text-sm">
                                            <option value="all">ทุกรุ่น</option>
                                            {stats.sessions.map(s=><option key={s.id} value={s.id}>{s.batchName}</option>)}
                                        </select>
                                        <button onClick={()=>setShowScreenshot(true)} className="px-3 py-1 bg-slate-100 rounded text-sm font-bold flex gap-1 items-center"><LucideCamera className="w-4 h-4"/> Screen</button>
                                        <button onClick={downloadImages} className="px-3 py-1 bg-sky-600 text-white rounded text-sm font-bold flex gap-1 items-center"><LucideImages className="w-4 h-4"/> ZIP</button>
                                      </>
                                  )}
                              </div>
                          </div>
                          <div className="overflow-x-auto">
                              <table className="w-full text-sm text-left">
                                  <thead className="bg-slate-50 font-bold border-b">
                                      <tr>
                                          <th className="p-3 w-10">#</th>
                                          {tab === 'batch' && <th className="p-3">สถานะรุ่น</th>}
                                          {tab === 'reimburse' && <th className="p-3">สถานะเบิก</th>}
                                          {tab !== 'batch' && tab !== 'reimburse' && <th className="p-3">สถานะ</th>}
                                          <th className="p-3">ชื่อ-นามสกุล</th>
                                          <th className="p-3">บัตร ปชช.</th>
                                          <th className="p-3">รหัส พนง.</th>
                                          {tab === 'batch' && <><th className="p-3">สาขา</th><th className="p-3">หมายเหตุ</th></>}
                                          <th className="p-3 text-right">Actions</th>
                                      </tr>
                                  </thead>
                                  <tbody className="divide-y">
                                      {filteredData().map((r, i) => (
                                          <tr key={r.id} className="hover:bg-slate-50">
                                              <td className="p-3 text-slate-500">{i+1}</td>
                                              
                                              {tab === 'batch' ? (
                                                  <td className="p-3">
                                                      <select value={r.batchStatus || BatchStatus.NOT_JOINED_LINE} onChange={(e)=>handleBatchStatus(r.id, e.target.value)} className="bg-slate-100 border-none rounded text-xs font-bold py-1">
                                                          {Object.values(BatchStatus).map(s=><option key={s} value={s}>{s}</option>)}
                                                      </select>
                                                  </td>
                                              ) : tab === 'reimburse' ? (
                                                  <td className="p-3">
                                                      {r.reimbursementStatus === 'เบิกจ่ายแล้ว' ? 
                                                        <span className="text-green-600 font-bold text-xs flex items-center gap-1"><LucideCheckCircle className="w-3 h-3"/> จ่ายแล้ว</span> :
                                                        <span className="text-amber-500 font-bold text-xs flex items-center gap-1"><LucideClock className="w-3 h-3"/> รอจ่าย</span>
                                                      }
                                                  </td>
                                              ) : (
                                                  <td className="p-3"><span className="bg-slate-100 px-2 py-0.5 rounded text-xs font-bold">{r.status}</span></td>
                                              )}

                                              <td className="p-3">{r.prefix} {r.firstName} {r.lastName}</td>
                                              <td className="p-3 font-mono">{r.idCard}</td>
                                              <td className="p-3 font-mono">{r.empId}</td>
                                              
                                              {tab === 'batch' && <><td className="p-3">{r.branch}</td><td className="p-3 text-slate-400 italic">{r.note||'-'}</td></>}

                                              <td className="p-3 text-right flex justify-end gap-2">
                                                  {tab === 'reimburse' && r.reimbursementStatus !== 'เบิกจ่ายแล้ว' && (
                                                      <button onClick={()=>handleReimbursementStatus(r.id, 'เบิกจ่ายแล้ว')} className="p-1.5 bg-green-100 text-green-700 rounded hover:bg-green-200"><LucideCheckSquare className="w-4 h-4"/></button>
                                                  )}
                                              </td>
                                          </tr>
                                      ))}
                                  </tbody>
                              </table>
                          </div>
                      </div>
                  )}
                  
                  {showScreenshot && (
                      <div className="fixed inset-0 z-50 bg-white overflow-auto p-10">
                           <button onClick={()=>setShowScreenshot(false)} className="fixed top-4 right-4 bg-red-500 text-white p-2 rounded-full"><LucideX/></button>
                           <div className="max-w-3xl mx-auto border p-10 shadow-lg">
                               <h1 className="text-2xl font-bold text-center mb-4">รายชื่ออบรม</h1>
                               <table className="w-full text-sm border-collapse border">
                                   <thead><tr className="bg-slate-100"><th className="border p-2">ลำดับ</th><th className="border p-2">ชื่อ-นามสกุล</th><th className="border p-2">สาขา</th><th className="border p-2">สถานะ</th></tr></thead>
                                   <tbody>
                                       {filteredData().map((r,i) => (
                                           <tr key={r.id}><td className="border p-2 text-center">{i+1}</td><td className="border p-2">{r.prefix}{r.firstName} {r.lastName}</td><td className="border p-2">{r.branch}</td><td className="border p-2 text-red-500">{r.batchStatus}</td></tr>
                                       ))}
                                   </tbody>
                               </table>
                           </div>
                      </div>
                  )}
              </div>
          );
      };

      const App = () => {
        const [view, setView] = useState('public');
        const [tab, setTab] = useState('register');
        const [isAdmin, setIsAdmin] = useState(false);
        const [pwd, setPwd] = useState('');

        const handleLogin = (e) => {
            e.preventDefault();
            if(pwd === 'admin123') { setIsAdmin(true); } else { alert('Wrong Password'); }
        };

        return (
          <Layout activeView={view} onChangeView={setView} isAdminLoggedIn={isAdmin} onLogout={()=>{setIsAdmin(false); setView('public');}}>
            {view === 'public' ? (
               <div className="animate-fadeIn">
                   <div className="flex justify-center -mt-2 mb-10">
                       <div className="bg-white p-1.5 rounded-full shadow border inline-flex">
                           <button onClick={()=>setTab('register')} className={`px-6 py-2 rounded-full font-bold text-sm ${tab==='register'?'bg-slate-900 text-white':'text-slate-500'}`}>ลงทะเบียน</button>
                           <button onClick={()=>setTab('track')} className={`px-6 py-2 rounded-full font-bold text-sm ${tab==='track'?'bg-slate-900 text-white':'text-slate-500'}`}>ติดตามสถานะ</button>
                       </div>
                   </div>
                   {tab==='register' ? <RegistrationForm/> : <StatusTracker/>}
               </div>
            ) : (
                isAdmin ? <AdminDashboard/> : 
                <div className="flex justify-center py-20">
                    <form onSubmit={handleLogin} className="bg-white p-10 rounded-3xl shadow-xl max-w-sm w-full text-center border">
                        <LucideShield className="w-12 h-12 mx-auto text-brand-600 mb-4"/>
                        <h2 className="text-xl font-bold mb-6">Admin Portal</h2>
                        <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} className="w-full p-3 border rounded-xl mb-4" placeholder="Password"/>
                        <button className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Login</button>
                    </form>
                </div>
            )}
          </Layout>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
