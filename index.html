<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",

    "recharts": "https://esm.sh/recharts@^3.6.0",

<body>
    <div id="root"></div>

    <script type="text/babel">
      // --- GLOBAL IMPORTS & UTILS ---
      const { useState, useEffect, useRef } = React;

      // --- LUCIDE ICON ADAPTER (FIXED & ROBUST) ---
      const lucideMap = {};
      const lucideRaw = window.lucide;

      if (lucideRaw && lucideRaw.icons) {
        const renderIconNode = ([tag, attrs, children]) => {
            return React.createElement(
                tag,
                { ...attrs, key: Math.random() },
                Array.isArray(children) ? children.map(renderIconNode) : null
            );
        };

        const createIconComponent = (name, iconNode) => {
            return ({ color = "currentColor", size = 24, strokeWidth = 2, className, ...props }) => {
                const iconChildren = iconNode[2]; 
                return React.createElement(
                    "svg",
                    {
                        ...props,
                        xmlns: "http://www.w3.org/2000/svg",
                        width: size,
                        height: size,
                        viewBox: "0 0 24 24",
                        fill: "none",
                        stroke: color,
                        strokeWidth: strokeWidth,
                        strokeLinecap: "round",
                        strokeLinejoin: "round",
                        className: `lucide lucide-${name} ${className || ''}`
                    },
                    Array.isArray(iconChildren) ? iconChildren.map(renderIconNode) : null
                );
            };
        };

        Object.keys(lucideRaw.icons).forEach(key => {
            const Comp = createIconComponent(key, lucideRaw.icons[key]);
            lucideMap[key] = Comp;
            lucideMap[`Lucide${key}`] = Comp; 
        });
      }

      // Proxy to handle undefined icons gracefully
      const lucide = new Proxy(lucideMap, {
          get: (target, prop) => {
              if (prop in target) return target[prop];
              return ({ size = 24, ...props }) => React.createElement('svg', { width: size, height: size });
          }
      });

      const { 
        LucideShieldCheck, LucideUser, LucideLayoutDashboard, LucideLogOut, 
        LucideUserPlus, LucideSearch, LucideShield, LucideArrowRight, LucideLock,
        LucideUpload, LucideCheckCircle, LucideAlertCircle, LucideChevronRight, 
        LucideChevronLeft, LucideFileText, LucideBriefcase, LucideDollarSign, 
        LucideCheck, LucideEye, LucideX, LucideCalendar, LucideMapPin, 
        LucideUsers, LucideClipboardCheck, LucideLoader, LucideBuilding, 
        LucideQrCode, LucideMaximize2, LucideBanknote, LucideClock, LucideTrendingUp,
        LucideFilter, LucideCamera, LucideSave, LucidePrinter, LucideCopy, 
        LucideFileSpreadsheet, LucideImages, LucideCheckSquare, LucideArchive,
        LucideXCircle, LucideLayoutGrid, LucideEdit, LucideActivity, LucideRefreshCw
      } = lucide;

      // --- RECHARTS ADAPTER ---
      const RechartsLib = window.Recharts || {};
      const safeRecharts = (name) => RechartsLib[name] || (({children}) => children || null);
      const BarChart = safeRecharts('BarChart');
      const Bar = safeRecharts('Bar');
      const XAxis = safeRecharts('XAxis');
      const YAxis = safeRecharts('YAxis');
      const CartesianGrid = safeRecharts('CartesianGrid');
      const RechartsTooltip = safeRecharts('Tooltip');
      const ResponsiveContainer = RechartsLib.ResponsiveContainer || (({children}) => <div style={{width:'100%', height:'100%'}}>{children}</div>);
      const PieChart = safeRecharts('PieChart');
      const Pie = safeRecharts('Pie');
      const Cell = safeRecharts('Cell');

      // --- CONFIGURATION ---
      // IMPORTANT: Replace this with your own Google Apps Script Web App URL
      const API_URL = "https://script.google.com/macros/s/AKfycbxQ0b5oPHnR_J5_fPOcUtGihmq-pjdQ3Fhy_KZwTLPvHi4LUwGWQn8aIU4yydJFWdeGnw/exec";

      // --- TYPES & ENUMS ---
      const LicenseType = { LIFE: 'ประกันชีวิต (นช)', NON_LIFE: 'ประกันวินาศภัย (นว)' };
      const ExamMode = { SELF: 'Self-Passed (สอบเอง)', COMPANY: 'Company-Passed (สอบกับบริษัท)' };
      const RegistrationStatus = { PENDING: 'PENDING', APPROVED: 'APPROVED', REJECTED: 'REJECTED' };
      const BatchStatus = { NOT_JOINED_LINE: 'ยังไม่เข้าห้องไลน์', JOINED_LINE: 'เข้าห้องไลน์', MORNING_SESSION: 'รอบเช้า', AFTERNOON_SESSION: 'รอบบ่าย', COMPLETED: 'สมบูรณ์', WAIVED: 'สละสิทธิ์' };
      const ReimbursementStatus = { PENDING: 'รอเบิกจ่าย', PROCESSED: 'เบิกจ่ายแล้ว' };

      // --- API ADAPTER (REAL FETCH) ---
      const api = {
        _get: async (action, params = '') => {
          const url = `${API_URL}?action=${action}${params}`;
          try {
            const response = await fetch(url);
            const json = await response.json();
            if(!json.success) throw new Error(json.error || 'API Error');
            return json.data;
          } catch (e) {
            console.error(`API Error [${action}]:`, e);
            throw new Error(`Connection Error: ${e.message}`);
          }
        },
        _post: async (action, data) => {
          try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action, ...data }),
            });
            const json = await response.json();
            if(!json.success) throw new Error(json.error || 'API Error');
            return json.data;
          } catch (e) {
             console.error(`API Error [${action}]:`, e);
             throw new Error(`Submission Error: ${e.message}`);
          }
        },
        
        getSessions: async (type) => api._get('getSessions', `&type=${encodeURIComponent(type)}`),
        getAllSessions: async () => api._get('getAllSessions'),
        searchRegistration: async (query) => api._get('searchRegistration', `&query=${encodeURIComponent(query)}`),
        getAllRegistrations: async () => api._get('getAllRegistrations'),
        getStats: async () => api._get('getStats'),
        // New: getUserFromDB accepts a query (EmpID or ID Card)
        getUserFromDB: async (query) => api._get('getUserFromDB', `&query=${encodeURIComponent(query)}`),
        
        submitRegistration: async (data) => {
           const processedFiles = {};
           if(data.photoFile) processedFiles.photo = await fileToBase64(data.photoFile);
           if(data.idCardFile) processedFiles.idCard = await fileToBase64(data.idCardFile);
           if(data.examResultFile) processedFiles.examResult = await fileToBase64(data.examResultFile);
           if(data.receiptFile) processedFiles.receipt = await fileToBase64(data.receiptFile);
           if(data.bankBookFile) processedFiles.bankBook = await fileToBase64(data.bankBookFile);
           if(data.idCopyReimburseFile) processedFiles.idCopyReimburse = await fileToBase64(data.idCopyReimburseFile);

           const payload = { ...data, files: processedFiles };
           delete payload.photoFile; delete payload.idCardFile; delete payload.examResultFile;
           delete payload.receiptFile; delete payload.bankBookFile; delete payload.idCopyReimburseFile;
           
           return api._post('submitRegistration', payload);
        },
        updateStatus: (id, status) => api._post('updateStatus', { id, status }),
        updateBatchStatus: (id, status) => api._post('updateBatchStatus', { id, status }),
        updateReimbursementStatus: (id, status) => api._post('updateReimbursementStatus', { id, status }),
        updateRegistrationDetails: (id, data) => api._post('updateRegistrationDetails', { id, data }),
      };

      const fileToBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => {
             const result = reader.result;
             const base64 = result.split(',')[1];
             resolve({ name: file.name, mimeType: file.type, data: base64 });
          };
          reader.onerror = error => reject(error);
        });
      };

      // --- REUSABLE COMPONENTS ---
      const InputField = ({ label, required, rightIcon, ...props }) => (
        <div className="group relative">
            <label className="block text-sm font-semibold text-slate-700 mb-2 transition-colors group-focus-within:text-brand-600">
                {label} {required && <span className="text-red-500">*</span>}
            </label>
            <div className="relative">
                <input 
                    {...props}
                    required={required}
                    className="w-full px-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all outline-none text-slate-700 placeholder-slate-400 font-medium hover:border-slate-300 shadow-sm disabled:bg-slate-100 disabled:text-slate-400"
                />
                {rightIcon && <div className="absolute right-4 top-1/2 -translate-y-1/2">{rightIcon}</div>}
            </div>
        </div>
      );

      const RadioGroup = ({ label, name, value, options, onChange }) => (
        <div>
            <label className="block text-sm font-semibold text-slate-700 mb-3">{label}</label>
            <div className="grid gap-3">
                {options.map((opt) => (
                    <label key={opt.value} className={`relative flex items-center p-4 rounded-xl border-2 cursor-pointer transition-all duration-200 ${value === opt.value ? 'border-brand-500 bg-brand-50/50 shadow-sm ring-1 ring-brand-500/20' : 'border-slate-100 bg-white hover:border-brand-200 hover:bg-slate-50'}`}>
                        <input type="radio" name={name} value={opt.value} checked={value === opt.value} onChange={onChange} className="sr-only" />
                        <div className={`w-5 h-5 rounded-full border-2 mr-4 flex items-center justify-center transition-colors ${value === opt.value ? 'border-brand-500 bg-brand-500' : 'border-slate-300'}`}>
                            {value === opt.value && <div className="w-2 h-2 bg-white rounded-full" />}
                        </div>
                        <div>
                            <span className={`block font-bold text-sm ${value === opt.value ? 'text-brand-900' : 'text-slate-700'}`}>{opt.label}</span>
                            <span className="text-xs text-slate-500">{opt.desc}</span>
                        </div>
                        {value === opt.value && <LucideCheck className="absolute right-4 text-brand-500 w-5 h-5 opacity-20" />}
                    </label>
                ))}
            </div>
        </div>
      );

      const FileInput = ({ label, subLabel, required, onChange, variant = 'blue', exampleUrl, onPreview }) => {
        const isGreen = variant === 'green';
        const borderColor = isGreen ? 'hover:border-emerald-400' : 'hover:border-brand-400';
        const iconColor = isGreen ? 'text-emerald-500' : 'text-brand-500';
        const bgHover = isGreen ? 'group-hover:bg-emerald-50' : 'group-hover:bg-brand-50';

        return (
            <div className={`group relative border-2 border-dashed border-slate-300 rounded-2xl p-6 transition-all cursor-pointer text-center bg-white ${borderColor} hover:shadow-sm`}>
                {exampleUrl && (
                    <button
                        type="button"
                        onClick={(e) => { e.preventDefault(); e.stopPropagation(); onPreview(exampleUrl); }}
                        className="absolute top-3 right-3 z-20 flex items-center gap-1.5 px-3 py-1.5 bg-white/90 backdrop-blur-sm text-[11px] font-bold text-brand-600 rounded-full shadow-sm border border-brand-100 hover:bg-brand-50 transition-all hover:scale-105"
                    >
                        <LucideEye className="w-3.5 h-3.5" /> ตัวอย่าง
                    </button>
                )}
                <div className={`w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 bg-slate-50 ${bgHover} transition-colors`}>
                    <LucideUpload className={`w-6 h-6 text-slate-400 group-hover:${iconColor} transition-colors`} />
                </div>
                <label className="block text-sm font-bold text-slate-700 mb-1 pointer-events-none group-hover:text-slate-900">
                {label} {required && <span className="text-red-500">*</span>}
                </label>
                {subLabel && <p className="text-xs text-slate-400 mb-2">{subLabel}</p>}
                <div className="mt-2">
                    <span className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide bg-slate-100 text-slate-500 ${bgHover} group-hover:${iconColor} transition-colors`}>Browse File</span>
                </div>
                <input type="file" onChange={onChange} required={required} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            </div>
        );
      };

      const ReviewItem = ({ label, value }) => (
        <div className="flex flex-col">
            <span className="text-xs text-slate-400 font-medium mb-0.5">{label}</span>
            <span className="text-slate-800 font-semibold">{value || '-'}</span>
        </div>
      );

      const FileBadge = ({ label, file, color = 'blue' }) => {
        const bgColor = color === 'green' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-blue-100 text-blue-700 border-blue-200';
        return (
            <div className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-bold ${file ? bgColor : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
                {file ? <LucideCheckCircle className="w-3 h-3" /> : <LucideX className="w-3 h-3" />}
                {label}
            </div>
        );
      };

      const StatusBadge = ({ status }) => {
        let styleClass = "";
        if (status === RegistrationStatus.APPROVED) styleClass = "bg-green-100 text-green-700 ring-green-600/20";
        else if (status === RegistrationStatus.REJECTED) styleClass = "bg-red-100 text-red-700 ring-red-600/20";
        else styleClass = "bg-amber-100 text-amber-700 ring-amber-600/20";
        return <span className={`inline-flex px-3 py-1 rounded-full text-[10px] font-bold ring-1 ring-inset ${styleClass}`}>{status}</span>;
      };

      const StatCard = ({ title, value, icon, color, bg, trend }) => (
        <div className="bg-white p-6 rounded-3xl shadow-soft border border-slate-100 hover:shadow-lg transition-all duration-300 group">
            <div className="flex justify-between items-start mb-4">
                <div className={`p-3.5 rounded-2xl ${bg} ${color}`}>
                    {icon}
                </div>
                {trend && <span className="flex items-center gap-1 text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full"><LucideTrendingUp className="w-3 h-3" /> {trend}</span>}
            </div>
            <div>
            <p className="text-3xl font-extrabold text-slate-800 tracking-tight group-hover:scale-105 transition-transform origin-left">{value}</p>
            <p className="text-slate-400 text-sm font-semibold mt-1">{title}</p>
            </div>
        </div>
      );

      const InfoItem = ({ icon, label, value }) => (
        <div className="flex items-center gap-3 p-3 rounded-xl bg-slate-50/50 border border-slate-100 h-full">
            <div className="text-slate-400 shrink-0">{icon}</div>
            <div className="overflow-hidden">
                <p className="text-xs text-slate-400 font-medium uppercase tracking-wide truncate">{label}</p>
                <p className="text-sm font-semibold text-slate-700 truncate">{value}</p>
            </div>
        </div>
      );

      const TabButton = ({ active, onClick, icon, label }) => (
        <button 
            onClick={onClick}
            className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold transition-all whitespace-nowrap
                ${active ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 hover:bg-slate-100 border border-slate-200'}
            `}
        >
            {icon}
            {label}
        </button>
      );

      // --- PAGE COMPONENTS ---

      const Layout = ({ children, activeView, onChangeView, isAdminLoggedIn, onLogout }) => {
        return (
          <div className="min-h-screen relative flex flex-col overflow-hidden">
            <div className="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 bg-slate-50/50">
              <div className="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-brand-200/20 rounded-full blur-[100px]" />
              <div className="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-indigo-200/20 rounded-full blur-[120px]" />
            </div>

            <nav className="glass-nav sticky top-0 z-50 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between items-center h-20">
                  <div className="flex items-center gap-3 cursor-pointer group" onClick={() => onChangeView('public')}>
                    <div className="bg-gradient-to-br from-brand-600 to-brand-800 p-2.5 rounded-xl text-white shadow-lg shadow-brand-500/30 group-hover:scale-105 transition-transform duration-300">
                       <LucideShieldCheck className="h-7 w-7" />
                    </div>
                    <div className="flex flex-col">
                      <h1 className="text-xl font-bold tracking-tight text-slate-800 leading-tight">ระบบลงทะเบียนอบรม</h1>
                      <p className="text-[11px] text-slate-500 font-medium tracking-wide uppercase text-brand-600">Insurance License Training</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => onChangeView('public')}
                      className={`relative px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 flex items-center gap-2 overflow-hidden ${
                        activeView === 'public' ? 'bg-brand-50 text-brand-700 ring-1 ring-brand-200 shadow-sm' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-700'
                      }`}
                    >
                      <LucideUser className="w-4 h-4" /> <span className="hidden md:inline">สำหรับผู้ใช้ทั่วไป</span>
                    </button>

                    {isAdminLoggedIn ? (
                       <div className="flex items-center gap-2 pl-3 ml-1 border-l border-slate-200">
                          <button
                            onClick={() => onChangeView('admin')}
                            className={`relative px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 flex items-center gap-2 ${
                              activeView === 'admin' ? 'bg-slate-800 text-white shadow-lg shadow-slate-500/20' : 'text-slate-600 hover:bg-slate-100'
                            }`}
                          >
                            <LucideLayoutDashboard className="w-4 h-4" /> <span className="hidden md:inline">ผู้ดูแลระบบ</span>
                          </button>
                          <button onClick={onLogout} className="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors" title="ออกจากระบบ">
                            <LucideLogOut className="w-5 h-5" />
                          </button>
                       </div>
                    ) : (
                      <button onClick={() => onChangeView('admin')} className="px-4 py-2 rounded-full text-sm font-medium text-slate-400 hover:text-brand-600 hover:bg-white transition-all">
                        เจ้าหน้าที่
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </nav>

            <main className="flex-grow w-full max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 relative z-0">
              {children}
            </main>

            <footer className="bg-white/50 backdrop-blur border-t border-slate-200 text-slate-500 py-8 mt-auto">
              <div className="container mx-auto px-4 text-center">
                <p className="text-sm font-semibold text-slate-600">© {new Date().getFullYear()} Insurance Training Center</p>
              </div>
            </footer>
          </div>
        );
      };

      const RegistrationForm = () => {
        const [currentStep, setCurrentStep] = useState(1);
        const [loading, setLoading] = useState(false);
        const [success, setSuccess] = useState(false);
        const [error, setError] = useState(null);
        const [previewImage, setPreviewImage] = useState(null);
        
        // Auto-fill state
        const [isSearching, setIsSearching] = useState(false);
        const [searchError, setSearchError] = useState(null);

        // Session State
        const [sessions, setSessions] = useState([]);
        const [loadingSessions, setLoadingSessions] = useState(false);
        const [sessionError, setSessionError] = useState(null);

        const [formData, setFormData] = useState({
          licenseType: LicenseType.LIFE,
          examMode: ExamMode.SELF,
          wantReimbursement: false,
          prefix: 'นาย',
          position: '', zone: '', region: '', branch: '', idCard: '', empId: '',
          firstName: '', lastName: '', dob: '', phone: '', email: '', trainingSessionId: ''
        });

        const [files, setFiles] = useState({ photo: null, idCard: null, examResult: null, receipt: null, bankBook: null, idCopyReimburse: null });

        const fetchSessions = async () => {
            if (!formData.licenseType) return;
            setLoadingSessions(true);
            setSessionError(null);
            try {
                const data = await api.getSessions(formData.licenseType);
                setSessions(data);
            } catch (e) { 
                console.error(e); 
                setSessionError(e.message || "ไม่สามารถดึงข้อมูลได้");
            } finally { 
                setLoadingSessions(false); 
            }
        };

        useEffect(() => {
          fetchSessions();
        }, [formData.licenseType]);

        const handleChange = (e) => {
          const { name, value, type, checked } = e.target;
          setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
        };

        const handleSessionSelect = (session) => {
            setFormData(prev => ({
                ...prev, trainingSessionId: session.id, trainingDate: session.date, trainingBatch: session.batchName
            }));
        };
        
        // Auto-fill Logic
        const handleUserSearch = async (val) => {
            if (!val || val.length < 3) return;
            setIsSearching(true);
            setSearchError(null);
            try {
                const res = await api.getUserFromDB(val);
                if (res.found) {
                    setFormData(prev => ({
                        ...prev,
                        empId: res.empId || prev.empId,
                        idCard: res.idCard || prev.idCard,
                        prefix: res.prefix || prev.prefix,
                        firstName: res.firstName || prev.firstName,
                        lastName: res.lastName || prev.lastName,
                        position: res.position || prev.position,
                        branch: res.branch || prev.branch,
                        zone: res.zone || prev.zone,
                        region: res.region || prev.region,
                        dob: res.dob || prev.dob
                    }));
                } else {
                    // Optional: Notify user not found, or just do nothing
                    // console.log('User not found in DB');
                }
            } catch (e) {
                console.error("Auto-fill error:", e);
                setSearchError("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
            } finally {
                setIsSearching(false);
            }
        };

        const handleFileChange = (e, fieldName) => {
          if (e.target.files && e.target.files[0]) {
            setFiles(prev => ({ ...prev, [fieldName]: e.target.files[0] }));
          }
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setLoading(true); setError(null);
          if (!formData.idCard || !formData.empId || !formData.firstName || !formData.trainingSessionId) {
              setError("กรุณากรอกข้อมูลสำคัญและเลือกรุ่นการอบรมให้ครบถ้วน");
              setLoading(false); return;
          }
          try {
            await api.submitRegistration({
              ...formData,
              photoFile: files.photo,
              idCardFile: files.idCard,
              examResultFile: files.examResult,
              receiptFile: files.receipt,
              bankBookFile: files.bankBook,
              idCopyReimburseFile: files.idCopyReimburse,
            });
            setSuccess(true);
            window.scrollTo(0, 0);
          } catch (err) {
            setError(err.message || "เกิดข้อผิดพลาดในการส่งข้อมูล: " + err.message);
          } finally { setLoading(false); }
        };

        const nextStep = () => setCurrentStep(prev => Math.min(prev + 1, 6));
        const prevStep = () => setCurrentStep(prev => Math.max(prev - 1, 1));
        
        const STEPS = [
          { id: 1, title: 'หลักสูตร', icon: LucideFileText },
          { id: 2, title: 'เลือกรุ่น', icon: LucideCalendar },
          { id: 3, title: 'ข้อมูลส่วนตัว', icon: LucideUser },
          { id: 4, title: 'ข้อมูลงาน', icon: LucideBriefcase },
          { id: 5, title: 'เอกสาร', icon: LucideUpload },
          { id: 6, title: 'ตรวจสอบ', icon: LucideClipboardCheck },
        ];

        if (success) {
            return (
              <div className="max-w-xl mx-auto text-center py-20 bg-white rounded-3xl shadow-soft p-10 animate-slideUp border border-slate-100">
                <div className="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                    <LucideCheckCircle className="w-12 h-12 text-green-500 drop-shadow-sm" />
                </div>
                <h2 className="text-3xl font-bold text-slate-800 mb-3">ลงทะเบียนสำเร็จ!</h2>
                <p className="text-slate-500 mb-8 leading-relaxed">ข้อมูลถูกส่งเข้าระบบเรียบร้อยแล้ว <br/>เจ้าหน้าที่จะทำการตรวจสอบและอนุมัติภายใน 1-2 วันทำการ</p>
                <button onClick={() => window.location.reload()} className="bg-brand-600 text-white px-8 py-3.5 rounded-xl font-bold hover:bg-brand-700 transition-all shadow-lg">ลงทะเบียนท่านอื่นต่อ</button>
              </div>
            );
        }

        return (
            <div className="max-w-6xl mx-auto">
                 {previewImage && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn" onClick={() => setPreviewImage(null)}>
                        <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden animate-slideUp" onClick={e => e.stopPropagation()}>
                            <div className="p-4 border-b flex justify-between items-center"><h3 className="font-bold flex items-center gap-2"><LucideEye className="w-5 h-5 text-brand-500"/> ตัวอย่าง</h3><button onClick={() => setPreviewImage(null)}><LucideX/></button></div>
                            <div className="p-6 flex justify-center"><img src={previewImage} className="max-h-[60vh] object-contain rounded"/></div>
                        </div>
                    </div>
                )}
                 
                 <div className="flex justify-between items-start relative z-0 max-w-5xl mx-auto px-4 overflow-x-auto pb-4 hide-scrollbar mb-10">
                    <div className="absolute top-[22px] left-0 w-full h-[2px] bg-slate-100 -z-10 rounded-full mx-4 min-w-[600px]">
                         <div className="h-full bg-brand-500 transition-all duration-700 ease-in-out rounded-full shadow-[0_0_10px_rgba(59,130,246,0.5)]" style={{ width: `${((currentStep - 1) / (STEPS.length - 1)) * 100}%` }}></div>
                    </div>
                    <div className="flex justify-between w-full min-w-[600px]">
                        {STEPS.map((step) => {
                            const Icon = step.icon;
                            const isActive = currentStep >= step.id;
                            const isCurrent = currentStep === step.id;
                            return (
                                <div key={step.id} className="flex flex-col items-center group cursor-default">
                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-500 border-[3px] shadow-sm z-10 ${isActive ? 'bg-brand-600 border-white text-white shadow-brand-500/30 scale-110' : 'bg-white border-slate-100 text-slate-300'} ${isCurrent ? 'ring-4 ring-brand-100' : ''}`}>
                                        <Icon className="w-5 h-5" />
                                    </div>
                                    <p className={`text-sm font-bold mt-3 ${isActive ? 'text-slate-800' : 'text-slate-400'}`}>{step.title}</p>
                                </div>
                            );
                        })}
                    </div>
                </div>

                <div className="bg-white rounded-[2rem] shadow-soft overflow-hidden border border-slate-100 relative">
                  <form onSubmit={handleSubmit}>
                    <div className="p-8 lg:p-12 min-h-[450px]">
                        {error && <div className="mb-8 bg-red-50 border border-red-100 p-4 rounded-2xl text-red-700 flex gap-2 animate-shake"><LucideAlertCircle /> {error}</div>}
                        
                        <div className="max-w-4xl mx-auto animate-slideUp">
                            {currentStep === 1 && (
                                <div className="space-y-8">
                                    <div className="text-center mb-8">
                                        <h3 className="text-xl font-bold text-slate-800">เลือกประเภทการอบรม</h3>
                                        <p className="text-slate-500 text-sm mt-1">กรุณาเลือกประเภทใบอนุญาตและรูปแบบการสอบ</p>
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-8">
                                        <RadioGroup label="ประเภทใบอนุญาต" name="licenseType" value={formData.licenseType} options={[{ value: LicenseType.LIFE, label: 'ประกันชีวิต (Life)', desc: 'สำหรับตัวแทนประกันชีวิต' }, { value: LicenseType.NON_LIFE, label: 'วินาศภัย (Non-Life)', desc: 'สำหรับตัวแทนประกันวินาศภัย' }]} onChange={handleChange} />
                                        <RadioGroup label="รูปแบบการสอบ" name="examMode" value={formData.examMode} options={[{ value: ExamMode.SELF, label: 'สอบเอง (Self)', desc: 'สอบผ่านสนามสอบด้วยตนเอง' }, { value: ExamMode.COMPANY, label: 'สอบกับบริษัท (Company)', desc: 'สอบผ่านโควต้าบริษัท' }]} onChange={handleChange} />
                                    </div>
                                </div>
                            )}

                            {currentStep === 2 && (
                                <div className="space-y-6">
                                    <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100"><div className="bg-brand-50 p-2 rounded-lg text-brand-600"><LucideCalendar className="w-5 h-5"/></div><h3 className="text-lg font-bold text-slate-700">เลือกรุ่นอบรม</h3></div>
                                    
                                    {loadingSessions ? (
                                        <div className="text-center p-10"><LucideLoader className="animate-spin mx-auto text-brand-500"/> <span className="text-slate-500 mt-2 block">กำลังโหลดข้อมูล...</span></div>
                                    ) : sessionError ? (
                                        <div className="text-center p-10 bg-red-50 rounded-2xl border border-red-100">
                                            <LucideAlertCircle className="w-10 h-10 text-red-500 mx-auto mb-2"/>
                                            <p className="text-red-700 font-bold">ไม่สามารถโหลดข้อมูลได้</p>
                                            <p className="text-red-500 text-sm">{sessionError}</p>
                                            <button type="button" onClick={fetchSessions} className="mt-4 px-4 py-2 bg-white border border-red-200 text-red-600 rounded-lg hover:bg-red-50 font-bold text-sm">ลองใหม่อีกครั้ง</button>
                                        </div>
                                    ) : sessions.length === 0 ? (
                                        <div className="text-center p-10 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                                            <p className="text-slate-500">ไม่พบรุ่นอบรมสำหรับประเภทนี้</p>
                                            <button type="button" onClick={fetchSessions} className="mt-4 px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 font-bold text-sm">รีเฟรชข้อมูล</button>
                                        </div>
                                    ) : (
                                     <div className="grid md:grid-cols-2 gap-4">
                                        {sessions.map(s => {
                                            const isFull = s.currentSeats >= s.maxSeats;
                                            const selected = formData.trainingSessionId === s.id;
                                            const percent = (s.currentSeats / s.maxSeats) * 100;
                                            return (
                                                <div key={s.id} onClick={() => !isFull && handleSessionSelect(s)} className={`p-6 rounded-2xl border-2 cursor-pointer transition-all ${isFull ? 'opacity-60 bg-slate-50 cursor-not-allowed' : selected ? 'border-brand-500 bg-brand-50 ring-1 ring-brand-500' : 'border-slate-100 hover:border-brand-200'}`}>
                                                    <div className="flex justify-between mb-2">
                                                        <h4 className="font-bold">{s.batchName}</h4>
                                                        {selected && <LucideCheck className="text-brand-600"/>}
                                                    </div>
                                                    <p className="text-sm text-slate-500 mb-2">{new Date(s.date).toLocaleDateString('th-TH')}</p>
                                                    <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-2"><div className={`h-full ${isFull?'bg-red-400':'bg-brand-500'}`} style={{width: `${percent}%`}}></div></div>
                                                    <div className="text-xs font-bold text-brand-600">{isFull ? 'เต็ม' : `ว่าง ${s.maxSeats - s.currentSeats} ที่นั่ง`}</div>
                                                </div>
                                            )
                                        })}
                                     </div>
                                    )}
                                </div>
                            )}

                            {currentStep === 3 && (
                                <div className="space-y-6">
                                     <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100"><div className="bg-brand-50 p-2 rounded-lg text-brand-600"><LucideUser className="w-5 h-5"/></div><h3 className="text-lg font-bold text-slate-700">ข้อมูลส่วนตัว</h3></div>
                                     {searchError && <p className="text-red-500 text-sm bg-red-50 p-2 rounded">{searchError}</p>}
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div className="md:col-span-2">
                                            <InputField 
                                                label="รหัสพนักงาน" 
                                                name="empId" 
                                                value={formData.empId} 
                                                onChange={handleChange} 
                                                onBlur={(e) => handleUserSearch(e.target.value)}
                                                rightIcon={isSearching && <LucideLoader className="w-4 h-4 animate-spin text-brand-500"/>}
                                                required
                                            />
                                        </div>
                                        <div className="md:col-span-2">
                                            <InputField 
                                                label="เลขบัตรประชาชน" 
                                                name="idCard" 
                                                value={formData.idCard} 
                                                onChange={handleChange} 
                                                onBlur={(e) => handleUserSearch(e.target.value)}
                                                maxLength={13} 
                                                required 
                                                placeholder="เลข 13 หลัก"
                                            />
                                        </div>
                                        <div>
                                            <label className="font-bold text-sm text-slate-700">คำนำหน้า <span className="text-red-500">*</span></label>
                                            <select className="w-full p-3.5 bg-slate-50 border rounded-xl mt-2 outline-none" name="prefix" value={formData.prefix} onChange={handleChange}><option>นาย</option><option>นาง</option><option>นางสาว</option></select>
                                        </div>
                                        <div><InputField label="ชื่อจริง" name="firstName" value={formData.firstName} onChange={handleChange} required/></div>
                                        <div><InputField label="นามสกุล" name="lastName" value={formData.lastName} onChange={handleChange} required/></div>
                                        <div><InputField label="วันเกิด" type="date" name="dob" value={formData.dob} onChange={handleChange} required/></div>
                                        <div><InputField label="เบอร์โทรศัพท์" name="phone" value={formData.phone} onChange={handleChange} required/></div>
                                        <div className="md:col-span-2"><InputField label="อีเมล" type="email" name="email" value={formData.email} onChange={handleChange} required/></div>
                                    </div>
                                </div>
                            )}

                            {currentStep === 4 && (
                                <div className="space-y-6">
                                    <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100"><div className="bg-brand-50 p-2 rounded-lg text-brand-600"><LucideBriefcase className="w-5 h-5"/></div><h3 className="text-lg font-bold text-slate-700">ข้อมูลการทำงาน</h3></div>
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <InputField label="ตำแหน่ง" name="position" value={formData.position} onChange={handleChange}/>
                                        <InputField label="สาขา / แผนก" name="branch" value={formData.branch} onChange={handleChange}/>
                                        <InputField label="เขต / ฝ่าย" name="zone" value={formData.zone} onChange={handleChange}/>
                                        <InputField label="สังกัดภาค" name="region" value={formData.region} onChange={handleChange}/>
                                    </div>
                                </div>
                            )}

                            {currentStep === 5 && (
                                <div className="space-y-6">
                                    <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100"><div className="bg-brand-50 p-2 rounded-lg text-brand-600"><LucideUpload className="w-5 h-5"/></div><h3 className="text-lg font-bold text-slate-700">อัปโหลดเอกสาร</h3></div>
                                    <div className="grid md:grid-cols-3 gap-4">
                                        <FileInput label="รูปถ่ายหน้าตรง" onChange={(e)=>handleFileChange(e,'photo')} required exampleUrl="https://via.placeholder.com/150" onPreview={setPreviewImage}/>
                                        <FileInput label="สำเนาบัตรประชาชน" onChange={(e)=>handleFileChange(e,'idCard')} required/>
                                        <FileInput label="ผลสอบผ่าน (OIC)" onChange={(e)=>handleFileChange(e,'examResult')} required/>
                                    </div>
                                    {formData.examMode === ExamMode.SELF && (
                                        <div className="mt-8 bg-gradient-to-br from-emerald-50 to-teal-50 p-8 rounded-2xl border border-emerald-100/50 relative overflow-hidden">
                                            <div className="relative z-10">
                                                <label className="flex items-center gap-3 font-bold text-slate-800 cursor-pointer">
                                                    <input type="checkbox" name="wantReimbursement" checked={formData.wantReimbursement} onChange={handleChange} className="w-5 h-5 accent-emerald-600"/>
                                                    ขอเบิกเงินค่าสมัครสอบ (200 บาท)
                                                </label>
                                                {formData.wantReimbursement && (
                                                    <div className="grid md:grid-cols-3 gap-4 mt-6 animate-fadeIn">
                                                        <FileInput label="ใบเสร็จ" variant="green" onChange={(e)=>handleFileChange(e,'receipt')} required exampleUrl="https://via.placeholder.com/150" onPreview={setPreviewImage}/>
                                                        <FileInput label="สำเนาบัตร (เบิก)" variant="green" onChange={(e)=>handleFileChange(e,'idCopyReimburse')} required/>
                                                        <FileInput label="หน้าสมุดบัญชี" variant="green" onChange={(e)=>handleFileChange(e,'bankBook')} required/>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                             {currentStep === 6 && (
                                <div className="bg-slate-50 p-6 rounded-xl space-y-4 text-sm border border-slate-200">
                                    <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200"><div className="bg-brand-50 p-2 rounded-lg text-brand-600"><LucideClipboardCheck className="w-5 h-5"/></div><h3 className="text-lg font-bold text-slate-700">ตรวจสอบข้อมูล</h3></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <ReviewItem label="ชื่อ-นามสกุล" value={`${formData.prefix}${formData.firstName} ${formData.lastName}`} />
                                        <ReviewItem label="รุ่นอบรม" value={formData.trainingBatch} />
                                        <ReviewItem label="รหัสพนักงาน" value={formData.empId} />
                                        <ReviewItem label="เบอร์โทร" value={formData.phone} />
                                    </div>
                                    <div className="flex gap-2 pt-4">
                                        <FileBadge label="รูปถ่าย" file={files.photo} />
                                        <FileBadge label="บัตรประชาชน" file={files.idCard} />
                                        <FileBadge label="ผลสอบ" file={files.examResult} />
                                        {formData.wantReimbursement && <span className="text-emerald-600 text-xs font-bold flex items-center"><LucideCheckCircle className="w-3 h-3 mr-1"/> ขอเบิกเงิน</span>}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="bg-slate-50/50 p-8 border-t flex justify-between">
                        {currentStep > 1 && <button type="button" onClick={prevStep} className="flex items-center text-slate-500 font-bold hover:text-slate-800 px-6 py-3 rounded-xl hover:bg-slate-100 transition-all"><LucideChevronLeft className="w-5 h-5 mr-1"/> ย้อนกลับ</button>}
                        {currentStep < 6 ? 
                            <button type="button" onClick={nextStep} className="bg-brand-600 text-white px-8 py-3.5 rounded-xl font-bold ml-auto shadow-lg hover:shadow-brand-500/40 flex items-center">ถัดไป <LucideChevronRight className="w-5 h-5 ml-1"/></button> :
                            <button type="submit" disabled={loading} className="bg-emerald-600 text-white px-10 py-3.5 rounded-xl font-bold ml-auto shadow-lg hover:shadow-emerald-500/40">{loading?'กำลังส่งข้อมูล...':'ยืนยันการลงทะเบียน'}</button>
                        }
                    </div>
                  </form>
                </div>
            </div>
        );
      };

      const StatusTracker = () => {
          const [query, setQuery] = useState('');
          const [results, setResults] = useState(null);
          const [loading, setLoading] = useState(false);
          const [showQr, setShowQr] = useState(false);

          const handleSearch = async (e) => {
              e.preventDefault(); if(!query) return;
              setLoading(true);
              try { setResults(await api.searchRegistration(query)); } catch(e){console.error(e);}
              setLoading(false);
          };

          const getStatusBadge = (status) => {
              if (status === 'APPROVED') return <span className="bg-green-100 text-green-700 border border-green-200 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm">อนุมัติแล้ว</span>;
              if (status === 'REJECTED') return <span className="bg-red-100 text-red-700 border border-red-200 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm">ไม่อนุมัติ</span>;
              return <span className="bg-amber-100 text-amber-700 border border-amber-200 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm">รอตรวจสอบ</span>;
          };

          return (
              <div className="max-w-4xl mx-auto space-y-10">
                  {/* QR Modal */}
                  {showQr && <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm animate-fadeIn" onClick={()=>setShowQr(false)}>
                      <div className="bg-white p-6 rounded-2xl max-w-sm w-full relative" onClick={e=>e.stopPropagation()}>
                          <button className="absolute top-2 right-2" onClick={()=>setShowQr(false)}><LucideX/></button>
                          <h3 className="text-center font-bold text-xl mb-4">QR CODE เข้าห้องไลน์</h3>
                          <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=LINE_GROUP_LINK" className="w-full"/>
                      </div>
                  </div>}

                  <div className="relative rounded-3xl overflow-hidden shadow-2xl bg-[#0f172a] text-white min-h-[300px] flex flex-col items-center justify-center p-8">
                       <div className="absolute inset-0">
                            <div className="absolute top-0 right-0 w-96 h-96 bg-brand-500/20 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/3"></div>
                            <div className="absolute bottom-0 left-0 w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px] translate-y-1/3 -translate-x-1/3"></div>
                        </div>
                      <div className="relative z-10 w-full max-w-2xl text-center">
                          <h2 className="text-3xl font-bold mb-4">ตรวจสอบสถานะการลงทะเบียน</h2>
                          <form onSubmit={handleSearch} className="flex bg-white rounded-full p-2 shadow-xl mt-6">
                              <LucideSearch className="w-6 h-6 text-slate-400 ml-4 self-center"/>
                              <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="ระบุรหัสพนักงาน / เลขบัตร" className="flex-grow bg-transparent px-4 py-3 outline-none text-slate-800 placeholder-slate-400 font-medium"/>
                              <button type="submit" className="bg-slate-900 text-white rounded-full px-8 py-2.5 font-bold hover:bg-brand-600 transition-colors">{loading?'...':'ค้นหา'}</button>
                          </form>
                      </div>
                  </div>

                  {results && <div className="space-y-6 animate-slideUp">
                      {results.length===0 ? 
                       <div className="bg-white p-16 rounded-3xl border border-dashed border-slate-300 text-center">
                           <LucideSearch className="w-12 h-12 text-slate-300 mx-auto mb-4"/>
                           <h3 className="text-xl font-bold text-slate-800">ไม่พบข้อมูล</h3>
                       </div> :
                       results.map(r => (
                           <div key={r.id} className="bg-white rounded-3xl shadow-soft p-8 border border-slate-100 flex flex-col md:flex-row gap-8 relative overflow-hidden">
                               <div className="absolute left-0 top-0 bottom-0 w-2 bg-gradient-to-b from-brand-400 to-brand-600"></div>
                               <div className="flex-grow">
                                   <div className="flex justify-between items-start mb-6">
                                       <div className="flex items-center gap-4">
                                            <div className="w-16 h-16 rounded-2xl bg-brand-50 flex items-center justify-center text-brand-600"><LucideUser className="w-8 h-8"/></div>
                                            <div>
                                                <h3 className="text-2xl font-bold text-slate-800">{r.prefix} {r.firstName} {r.lastName}</h3>
                                                <p className="text-sm text-slate-500 mt-1 font-mono">ID: {r.empId} • {r.position}</p>
                                            </div>
                                       </div>
                                       {getStatusBadge(r.status)}
                                   </div>
                                   <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                       <InfoItem icon={<LucideBuilding className="w-4 h-4"/>} label="สาขา" value={r.branch} />
                                       <InfoItem icon={<LucideClock className="w-4 h-4"/>} label="รุ่นอบรม" value={r.trainingBatch || '-'} />
                                       <InfoItem icon={<LucideCalendar className="w-4 h-4"/>} label="วันที่อบรม" value={r.trainingDate || '-'} />
                                       <div className="md:col-span-3">
                                            {r.wantReimbursement && (
                                                <div className="flex items-center gap-2 p-3 bg-slate-50 rounded-xl border border-slate-100">
                                                    <LucideBanknote className="w-4 h-4 text-slate-400"/>
                                                    <span className="text-xs font-bold text-slate-500 uppercase">สถานะเบิกเงิน:</span>
                                                    <span className={`text-sm font-bold ${r.reimbursementStatus==='เบิกจ่ายแล้ว'?'text-green-600':'text-amber-500'}`}>{r.reimbursementStatus || 'รอตรวจสอบ'}</span>
                                                </div>
                                            )}
                                       </div>
                                   </div>
                               </div>
                               <div className="bg-slate-50 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100 transition-colors text-center w-full md:w-56" onClick={()=>setShowQr(true)}>
                                   <LucideQrCode className="w-16 h-16 mb-2 text-slate-800"/>
                                   <span className="text-[10px] font-bold text-brand-600 uppercase tracking-widest">QR เข้าห้องไลน์</span>
                               </div>
                           </div>
                       ))
                      }
                  </div>}
              </div>
          );
      };

      const AdminDashboard = () => {
          const [stats, setStats] = useState(null);
          const [data, setData] = useState([]);
          const [tab, setTab] = useState('overview'); 
          const [selectedBatch, setSelectedBatch] = useState('all');
          const [loading, setLoading] = useState(true);
          const [showScreenshot, setShowScreenshot] = useState(false);
          const [editingUser, setEditingUser] = useState(null);
          const [showEditModal, setShowEditModal] = useState(false);

          const fetchData = async () => {
              setLoading(true);
              try {
                  const [s, d] = await Promise.all([api.getStats(), api.getAllRegistrations()]);
                  setStats(s); setData(d); 
              } catch (e) {
                  console.error(e);
                  setStats({total: 0, pending: 0, approved: 0, rejected: 0, byType: [], sessions: []});
                  setData([]);
              } finally {
                  setLoading(false);
              }
          };
          useEffect(() => { fetchData(); }, []);

          const filteredData = () => {
              let res = [...data];
              if(tab==='life') res = res.filter(r => r.licenseType.includes('Life') && !r.licenseType.includes('Non'));
              if(tab==='non_life') res = res.filter(r => r.licenseType.includes('Non-Life'));
              if(tab==='batch') {
                  if(selectedBatch !== 'all') res = res.filter(r => r.trainingSessionId === selectedBatch);
                  res = res.filter(r => r.trainingSessionId); 
                  res.sort((a,b) => a.idCard.localeCompare(b.idCard));
              }
              if(tab==='reimburse') res = res.filter(r => r.wantReimbursement);
              return res;
          };

          const handleBatchStatus = async (id, status) => {
              await api.updateBatchStatus(id, status); fetchData();
          };
          const handleReimbursementStatus = async (id, status) => {
              await api.updateReimbursementStatus(id, status); fetchData();
          };

          const handleSaveEdit = async (e) => {
              e.preventDefault();
              if (editingUser) {
                  await api.updateRegistrationDetails(editingUser.id, editingUser);
                  setShowEditModal(false);
                  fetchData();
              }
          };

          const downloadImages = async () => {
             const zip = new JSZip();
             filteredData().forEach((r, i) => { zip.file(`${i+1}_${r.idCard}_info.txt`, "Image links placeholder for GitHub Demo"); });
             const content = await zip.generateAsync({type:"blob"});
             saveAs(content, "Batch_Images.zip");
          };
          
          if(loading) return <div className="flex justify-center h-96 items-center flex-col"><div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-brand-500 mb-4"></div><p className="text-brand-600 font-bold tracking-widest text-sm">LOADING DASHBOARD...</p></div>;

          return (
              <div className="space-y-8 pb-20">
                  {/* Edit Modal */}
                  {showEditModal && editingUser && (
                      <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-slideUp">
                               <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                   <h3 className="font-bold text-lg text-slate-800">แก้ไขข้อมูล</h3>
                                   <button onClick={()=>setShowEditModal(false)}><LucideX className="w-5 h-5"/></button>
                               </div>
                               <form onSubmit={handleSaveEdit} className="p-6 space-y-4">
                                   <div className="grid grid-cols-2 gap-4">
                                       <input className="border p-2 rounded" value={editingUser.firstName} onChange={e=>setEditingUser({...editingUser, firstName:e.target.value})} placeholder="ชื่อ"/>
                                       <input className="border p-2 rounded" value={editingUser.lastName} onChange={e=>setEditingUser({...editingUser, lastName:e.target.value})} placeholder="นามสกุล"/>
                                   </div>
                                   <button type="submit" className="w-full bg-brand-600 text-white py-2 rounded font-bold">บันทึก</button>
                               </form>
                          </div>
                      </div>
                  )}

                  <div className="flex gap-2 overflow-x-auto pb-2 border-b border-slate-200/60 no-print">
                      {['overview','life','non_life','batch','reimburse'].map(t => (
                          <TabButton key={t} active={tab===t} onClick={()=>setTab(t)} label={t.toUpperCase()} icon={<LucideLayoutGrid className="w-4 h-4"/>} />
                      ))}
                  </div>

                  {tab === 'overview' ? (
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                          <StatCard title="ลงทะเบียนทั้งหมด" value={stats.total} icon={<LucideUsers className="w-6 h-6"/>} color="text-brand-600" bg="bg-brand-50" trend="+12%"/>
                          <StatCard title="รอตรวจสอบ" value={stats.pending} icon={<LucideClock className="w-6 h-6"/>} color="text-amber-500" bg="bg-amber-50"/>
                          <StatCard title="อนุมัติแล้ว" value={stats.approved} icon={<LucideCheckCircle className="w-6 h-6"/>} color="text-emerald-500" bg="bg-emerald-50"/>
                          <StatCard title="ไม่ผ่าน" value={stats.rejected} icon={<LucideXCircle className="w-6 h-6"/>} color="text-red-500" bg="bg-red-50"/>
                          <div className="md:col-span-4 h-80 bg-white p-6 rounded-3xl border border-slate-100 shadow-soft">
                              <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={stats.byType}>
                                  <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                  <XAxis dataKey="name" axisLine={false} tickLine={false} />
                                  <YAxis axisLine={false} tickLine={false} />
                                  <RechartsTooltip cursor={{fill: '#f1f5f9'}} />
                                  <Bar dataKey="value" fill="#3b82f6" radius={[4,4,0,0]} barSize={60}/>
                                </BarChart>
                              </ResponsiveContainer>
                          </div>
                      </div>
                  ) : (
                      <div className="bg-white rounded-[2rem] border border-slate-100 shadow-soft overflow-hidden min-h-[500px]">
                          <div className="p-8 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                              <h3 className="text-xl font-bold text-slate-800">รายการข้อมูล ({filteredData().length})</h3>
                              <div className="flex gap-2 flex-wrap">
                                  {tab === 'batch' && (
                                      <>
                                        <select value={selectedBatch} onChange={e=>setSelectedBatch(e.target.value)} className="border rounded-xl px-4 py-2 text-sm font-bold outline-none cursor-pointer">
                                            <option value="all">ทุกรุ่น (All Batches)</option>
                                            {stats.sessions.map(s=><option key={s.id} value={s.id}>{s.batchName}</option>)}
                                        </select>
                                        <button onClick={()=>setShowScreenshot(true)} className="px-4 py-2 bg-slate-100 rounded-xl text-sm font-bold flex gap-2 items-center hover:bg-slate-200"><LucideCamera className="w-4 h-4"/> Screenshot</button>
                                        <button onClick={downloadImages} className="px-4 py-2 bg-sky-600 text-white rounded-xl text-sm font-bold flex gap-2 items-center hover:bg-sky-700 shadow-lg shadow-sky-200/50"><LucideImages className="w-4 h-4"/> ZIP</button>
                                      </>
                                  )}
                              </div>
                          </div>
                          <div className="overflow-x-auto">
                              <table className="w-full text-sm text-left">
                                  <thead className="bg-slate-50 font-bold border-b border-slate-200 text-slate-700 whitespace-nowrap">
                                      <tr>
                                          <th className="px-6 py-4 w-12">#</th>
                                          {tab === 'batch' && <th className="px-6 py-4">สถานะรุ่น</th>}
                                          {tab === 'reimburse' && <th className="px-6 py-4">สถานะเบิก</th>}
                                          {tab !== 'batch' && tab !== 'reimburse' && <th className="px-6 py-4">สถานะ</th>}
                                          <th className="px-6 py-4">ชื่อ-นามสกุล</th>
                                          <th className="px-6 py-4">บัตร ปชช.</th>
                                          <th className="px-6 py-4">รหัส พนง.</th>
                                          {tab === 'batch' && <><th className="px-6 py-4">สาขา</th><th className="px-6 py-4">หมายเหตุ</th></>}
                                          <th className="px-6 py-4 text-center sticky right-0 bg-slate-50">Actions</th>
                                      </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100 whitespace-nowrap">
                                      {filteredData().map((r, i) => (
                                          <tr key={r.id} className="hover:bg-blue-50/30 transition-colors">
                                              <td className="px-6 py-4 text-slate-400 font-mono">{i+1}</td>
                                              
                                              {tab === 'batch' ? (
                                                  <td className="px-6 py-4">
                                                      <select value={r.batchStatus || BatchStatus.NOT_JOINED_LINE} onChange={(e)=>handleBatchStatus(r.id, e.target.value)} className="bg-slate-100 border-none rounded-lg text-xs font-bold py-1.5 px-2 outline-none cursor-pointer">
                                                          {Object.values(BatchStatus).map(s=><option key={s} value={s}>{s}</option>)}
                                                      </select>
                                                  </td>
                                              ) : tab === 'reimburse' ? (
                                                  <td className="px-6 py-4">
                                                      {r.reimbursementStatus === 'เบิกจ่ายแล้ว' ? 
                                                        <span className="text-green-600 font-bold text-xs flex items-center gap-1"><LucideCheckCircle className="w-3 h-3"/> จ่ายแล้ว</span> :
                                                        <span className="text-amber-500 font-bold text-xs flex items-center gap-1"><LucideClock className="w-3 h-3"/> รอจ่าย</span>
                                                      }
                                                  </td>
                                              ) : (
                                                  <td className="px-6 py-4"><StatusBadge status={r.status} /></td>
                                              )}

                                              <td className="px-6 py-4 font-bold text-slate-700">{r.prefix} {r.firstName} {r.lastName}</td>
                                              <td className="px-6 py-4 font-mono text-slate-500">{r.idCard}</td>
                                              <td className="px-6 py-4 font-mono"><span className="bg-slate-100 px-2 py-1 rounded text-slate-600">{r.empId}</span></td>
                                              
                                              {tab === 'batch' && <><td className="px-6 py-4">{r.branch}</td><td className="px-6 py-4 text-slate-400 italic text-xs">{r.note||'-'}</td></>}

                                              <td className="px-6 py-4 text-center sticky right-0 bg-white">
                                                  <div className="flex justify-center gap-2">
                                                    {tab === 'batch' && <button onClick={()=>{setEditingUser(r); setShowEditModal(true);}} className="p-1.5 hover:bg-slate-100 rounded text-slate-500"><LucideEdit className="w-4 h-4"/></button>}
                                                    {tab === 'reimburse' && r.reimbursementStatus !== 'เบิกจ่ายแล้ว' && (
                                                        <button onClick={()=>handleReimbursementStatus(r.id, 'เบิกจ่ายแล้ว')} className="p-1.5 bg-green-100 text-green-700 rounded hover:bg-green-200"><LucideCheckSquare className="w-4 h-4"/></button>
                                                    )}
                                                  </div>
                                              </td>
                                          </tr>
                                      ))}
                                  </tbody>
                              </table>
                          </div>
                      </div>
                  )}
                  
                  {showScreenshot && (
                      <div className="fixed inset-0 z-50 bg-white overflow-auto p-10">
                           <button onClick={()=>setShowScreenshot(false)} className="fixed top-4 right-4 bg-red-500 text-white p-2 rounded-full hover:bg-red-600"><LucideX/></button>
                           <div className="max-w-3xl mx-auto border p-10 shadow-2xl">
                               <h1 className="text-2xl font-bold text-center mb-4">รายชื่ออบรม</h1>
                               <table className="w-full text-sm border-collapse border">
                                   <thead><tr className="bg-slate-100"><th className="border p-2">ลำดับ</th><th className="border p-2">ชื่อ-นามสกุล</th><th className="border p-2">สาขา</th><th className="border p-2">สถานะ</th></tr></thead>
                                   <tbody>
                                       {filteredData().map((r,i) => (
                                           <tr key={r.id}><td className="border p-2 text-center">{i+1}</td><td className="border p-2">{r.prefix}{r.firstName} {r.lastName}</td><td className="border p-2">{r.branch}</td><td className="border p-2 text-red-500">{r.batchStatus}</td></tr>
                                       ))}
                                   </tbody>
                               </table>
                           </div>
                      </div>
                  )}
              </div>
          );
      };

      const App = () => {
        const [view, setView] = useState('public');
        const [tab, setTab] = useState('register');
        const [isAdmin, setIsAdmin] = useState(false);
        const [pwd, setPwd] = useState('');

        const handleLogin = (e) => {
            e.preventDefault();
            if(pwd === 'admin123') { setIsAdmin(true); } else { alert('Wrong Password'); }
        };

        return (
          <Layout activeView={view} onChangeView={setView} isAdminLoggedIn={isAdmin} onLogout={()=>{setIsAdmin(false); setView('public');}}>
            {view === 'public' ? (
               <div className="animate-fadeIn">
                   <div className="flex justify-center -mt-2 mb-12">
                       <div className="bg-white p-1.5 rounded-full shadow-lg shadow-slate-200/50 border border-slate-100 inline-flex items-center relative z-10">
                           <button onClick={()=>setTab('register')} className={`relative px-8 py-3 rounded-full text-sm font-bold transition-all duration-300 flex items-center gap-2 ${tab==='register'?'bg-slate-900 text-white shadow-md':'text-slate-500 hover:text-slate-900 hover:bg-slate-50'}`}><LucideUserPlus className="w-4 h-4"/> ลงทะเบียน</button>
                           <button onClick={()=>setTab('track')} className={`relative px-8 py-3 rounded-full text-sm font-bold transition-all duration-300 flex items-center gap-2 ${tab==='track'?'bg-slate-900 text-white shadow-md':'text-slate-500 hover:text-slate-900 hover:bg-slate-50'}`}><LucideSearch className="w-4 h-4"/> ติดตามสถานะ</button>
                       </div>
                   </div>
                   {tab==='register' ? <RegistrationForm/> : <StatusTracker/>}
               </div>
            ) : (
                isAdmin ? <AdminDashboard/> : 
                <div className="flex justify-center py-20 animate-fadeIn">
                    <div className="w-full max-w-[420px] bg-white p-10 rounded-[2.5rem] shadow-2xl shadow-slate-200 border border-white relative overflow-hidden group">
                         <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-brand-500 via-indigo-500 to-purple-500"></div>
                        <div className="w-20 h-20 bg-gradient-to-br from-white to-slate-50 rounded-2xl rotate-12 flex items-center justify-center mx-auto mb-8 shadow-lg border border-slate-100">
                            <LucideShield className="w-10 h-10 text-brand-600"/>
                        </div>
                        <h2 className="text-2xl font-extrabold text-slate-800 mb-2 text-center">Admin Portal</h2>
                        <form onSubmit={handleLogin} className="space-y-5 mt-8">
                            <div>
                                <label className="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-4">Password</label>
                                <div className="relative flex items-center">
                                    <LucideLock className="absolute left-5 text-slate-400 w-5 h-5"/>
                                    <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} className="w-full pl-14 pr-4 py-4 rounded-2xl border border-slate-200 bg-white focus:border-brand-500 outline-none transition-all font-medium text-lg placeholder-slate-300 shadow-sm" placeholder="••••••••"/>
                                </div>
                            </div>
                            <button className="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-brand-600 transition-all shadow-xl hover:shadow-brand-500/20 flex items-center justify-center gap-2">เข้าสู่ระบบ <LucideArrowRight className="w-4 h-4"/></button>
                        </form>
                    </div>
                </div>
            )}
          </Layout>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
